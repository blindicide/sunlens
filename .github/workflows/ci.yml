name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qt-arch: linux_gcc_64
          - os: windows-2022
            qt-arch: win64_msvc2022_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libegl1 libxcb-cursor0 clang-format clang-tidy
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.8.3'
          arch: ${{ matrix.qt-arch }}
          cache: false
      - name: Repository checks
        run: python tools/check-repository.py
      - name: Formatting
        if: runner.os == 'Linux'
        run: python tools/check-format.py
      - name: Acquire hash-pinned core for non-privileged validation
        if: runner.os == 'Linux'
        run: |
          python tools/fetch-core.py --destination build/dependencies
          python tools/fetch-core.py --core xray --destination build/dependencies
      - name: Configure
        if: runner.os == 'Windows'
        run: cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Configure including real core validator
        if: runner.os == 'Linux'
        run: cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DSUNLENS_SING_BOX_EXECUTABLE="$PWD/build/dependencies/sing-box" -DSUNLENS_XRAY_EXECUTABLE="$PWD/build/dependencies/xray"
      - name: Build
        run: cmake --build build/ci --config Release --parallel 2
      - name: Clang static analyzer
        if: runner.os == 'Linux'
        run: python tools/check-static.py --build-directory build/ci
      - name: Non-privileged tests (not TUN verification)
        run: ctest --test-dir build/ci -C Release --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software

  deb-package-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Native Qt toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev qt6-declarative-dev \
            qml6-module-qtqml qml6-module-qtqml-models qml6-module-qtqml-workerscript \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates qml6-module-qtquick-window
      - name: Check local-only DEB build and payload
        run: |
          python3 tools/fetch-core.py --destination build/dependencies
          python3 tools/fetch-core.py --core xray --destination build/dependencies
          cmake -S . -B build/deb -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DSUNLENS_PACKAGE_DEB=ON \
            -DSUNLENS_PACKAGE_SING_BOX="$PWD/build/dependencies/sing-box" \
            -DSUNLENS_PACKAGE_XRAY="$PWD/build/dependencies/xray"
          cmake --build build/deb --target package --parallel 2
          python3 tools/verify-deb.py "build/deb/sunlens-$(cat VERSION)-linux-amd64.deb"
