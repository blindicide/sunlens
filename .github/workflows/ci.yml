name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qt-arch: linux_gcc_64
          - os: windows-2022
            qt-arch: win64_msvc2022_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libegl1 libxcb-cursor0 clang-format
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.8.3'
          arch: ${{ matrix.qt-arch }}
          cache: false
      - name: Repository checks
        run: python tools/check-repository.py
      - name: Formatting
        if: runner.os == 'Linux'
        run: python tools/check-format.py
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Configure Windows x64
        if: runner.os == 'Windows'
        run: cmake -S . -B build/ci -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build/ci --config Release --parallel 2
      - name: Non-privileged tests (not TUN verification)
        run: ctest --test-dir build/ci -C Release --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
      - name: Stage Windows x64 preview
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $qtDeploy = (Get-Command windeployqt.exe -ErrorAction Stop).Source
          cmake -DAPP=build/ci/Release/sunlens.exe "-DWINDEPLOYQT=$qtDeploy" `
            -DSTAGE=build/windows-x64-preview -P cmake/stage-windows-x64.cmake
      - name: Check the staged preview and core without starting TUN
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: pwsh
        run: |
          $stage = (Resolve-Path build/windows-x64-preview).Path
          $fixture = (Resolve-Path build/ci/Release/proxy_tests.exe).Path
          foreach ($protocol in @('http', 'socks5')) {
            $config = Join-Path $env:RUNNER_TEMP "sunlens-$protocol.json"
            & $fixture --write-config $protocol | Set-Content -Encoding utf8NoBOM $config
            if ($LASTEXITCODE -ne 0) { throw "Could not generate $protocol fixture" }
            & "$stage/cores/sing-box/sing-box.exe" check -c $config
            if ($LASTEXITCODE -ne 0) { throw "sing-box rejected $protocol fixture" }
          }
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:QT_PLUGIN_PATH, Env:QML2_IMPORT_PATH, Env:QML_IMPORT_PATH -ErrorAction SilentlyContinue
          $env:QT_QPA_PLATFORM = 'windows'
          $env:QT_QUICK_BACKEND = 'software'
          $app = Start-Process -FilePath "$stage/sunlens.exe" -ArgumentList '--smoke-test' -WorkingDirectory $env:RUNNER_TEMP -PassThru -Wait
          if ($app.ExitCode -ne 0) { throw "Staged app failed to launch: $($app.ExitCode)" }
